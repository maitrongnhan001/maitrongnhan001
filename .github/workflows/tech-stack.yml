name: Update tech stack

on:
  schedule:
    - cron: "0 1 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tech-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan all repositories (public + private)
        run: python .github/scripts/tech_stack.py
        env:
          # Classic PAT with `repo` scope (same METRICS_TOKEN secret works)
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: maitrongnhan001
          INCLUDE_FORKS: "false"
          INCLUDE_ARCHIVED: "true"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update tech stack"
          git push
